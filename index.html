<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:#f4f1ea;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
}
.card{
  background:#fff;border-radius:24px;
  padding:44px 32px 36px;
  max-width:340px;width:92%;
  text-align:center;
  box-shadow:0 12px 40px rgba(26,42,108,.10);
  border-top:7px solid #c5a059;
}
.logo{
  width:88px;height:88px;border-radius:18px;
  object-fit:cover;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  margin-bottom:18px;
}
h1{color:#1a2a6c;font-size:1.65rem;font-weight:700;letter-spacing:.5px;margin-bottom:3px}
.sub{color:#aaa;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:26px}
.badge{
  display:inline-block;background:#1a2a6c;color:#fff;
  border-radius:20px;padding:5px 20px;
  font-size:1rem;font-weight:700;font-family:sans-serif;
  margin-bottom:6px;
}
.tipo{font-size:1.35rem;font-weight:800;color:#1a2a6c;font-family:sans-serif;margin-bottom:30px}
.btn{
  display:block;width:100%;padding:17px;border:none;border-radius:14px;
  font-size:1rem;font-weight:700;font-family:sans-serif;
  cursor:pointer;transition:opacity .15s;margin-bottom:10px;
}
.btn:active{opacity:.8}
.btn-gold{background:#c5a059;color:#fff}
.btn-gray{background:#eee;color:#888;font-size:.8rem;margin-top:6px}
.hint{margin-top:22px;font-size:.73rem;color:#bbb;line-height:1.6;font-family:sans-serif}
.hint b{color:#999}
</style>
</head>
